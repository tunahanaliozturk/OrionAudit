<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>


  <rect width="1200" height="730" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionAudit - capture on SaveChanges</text>
  <text class="subtitle" x="40" y="78">Audit rows join the same SaveChanges as your data, so they commit together or not at all.</text>

  <!-- 1. caller -->
  <rect class="step" x="40" y="110" width="300" height="64" rx="14"/>
  <text class="label" x="190" y="138" text-anchor="middle">Your code saves</text>
  <text class="code" x="190" y="160" text-anchor="middle">SaveChanges / SaveChangesAsync</text>
  <circle class="badge" cx="40" cy="110" r="12"/>
  <text class="badge-text" x="40" y="114" text-anchor="middle">1</text>

  <path class="flow" d="M190,174 L190,208"/>

  <!-- 2. interceptor -->
  <rect class="step" x="40" y="210" width="300" height="72" rx="14"/>
  <text class="code" x="190" y="240" text-anchor="middle">AuditSaveChangesInterceptor</text>
  <text class="small" x="190" y="262" text-anchor="middle">audited Added / Modified / Deleted entries</text>
  <circle class="badge" cx="40" cy="210" r="12"/>
  <text class="badge-text" x="40" y="214" text-anchor="middle">2</text>

  <path class="flow" d="M190,282 L190,316"/>

  <!-- 3. snapshots -->
  <rect class="step" x="40" y="318" width="300" height="72" rx="14"/>
  <text class="code" x="190" y="348" text-anchor="middle">SnapshotBuilder.Build</text>
  <text class="small" x="190" y="370" text-anchor="middle">before + after; Hash, Redact, Exclude applied</text>
  <circle class="badge" cx="40" cy="318" r="12"/>
  <text class="badge-text" x="40" y="322" text-anchor="middle">3</text>

  <path class="flow" d="M190,390 L190,424"/>

  <!-- decision -->
  <polygon class="decision" points="190,426 300,490 190,554 80,490"/>
  <text class="code" x="190" y="486" text-anchor="middle">UseAsyncCapture</text>
  <text class="small" x="190" y="506" text-anchor="middle">configured?</text>

  <!-- sync lane -->
  <path class="flow" d="M300,490 L378,490"/>
  <text class="edge" x="339" y="480" text-anchor="middle">no</text>

  <rect class="step" x="380" y="454" width="220" height="72" rx="14"/>
  <text class="code" x="490" y="484" text-anchor="middle">DiffEngine.Compute</text>
  <text class="small" x="490" y="506" text-anchor="middle">RFC 6902 JSON Patch</text>

  <path class="flow" d="M600,490 L638,490"/>

  <rect class="step" x="640" y="454" width="230" height="72" rx="14"/>
  <text class="label" x="755" y="484" text-anchor="middle">AuditLog row</text>
  <text class="small" x="755" y="506" text-anchor="middle">added to the same context</text>

  <path class="flow" d="M870,490 L908,490"/>

  <rect class="step" x="910" y="454" width="250" height="72" rx="14"/>
  <text class="label" x="1035" y="484" text-anchor="middle">Stamp and publish</text>
  <text class="small" x="1035" y="506" text-anchor="middle">UseHashChain, IAuditEventPublisher</text>

  <path class="flow" d="M1035,526 L1035,622"/>

  <!-- sync failure -->
  <path class="flow alt" d="M490,454 L490,404"/>
  <rect class="fail" x="380" y="330" width="330" height="72" rx="14"/>
  <text class="label" x="545" y="360" text-anchor="middle">Snapshot or diff throws</text>
  <text class="small" x="545" y="382" text-anchor="middle">row still written: Diff = [], Error = exception</text>
  <text class="edge" x="500" y="432">entries.failed</text>

  <!-- async lane -->
  <path class="flow" d="M190,554 L190,660 L378,660"/>
  <text class="edge" x="204" y="600">yes</text>

  <rect class="step" x="380" y="624" width="490" height="72" rx="14"/>
  <text class="code" x="625" y="654" text-anchor="middle">OrionAudit_Capture_Queue row</text>
  <text class="small" x="625" y="676" text-anchor="middle">BeforeJson + AfterJson; AuditDispatcher computes the diff later</text>

  <path class="flow" d="M870,660 L908,660"/>

  <!-- commit -->
  <rect class="ok" x="910" y="624" width="250" height="72" rx="14"/>
  <text class="label" x="1035" y="654" text-anchor="middle">EF Core commits</text>
  <text class="small" x="1035" y="676" text-anchor="middle">your rows + audit rows, one transaction</text>

  <!-- note -->
  <rect class="note" x="760" y="120" width="400" height="120" rx="10"/>
  <text class="small" x="780" y="150">Sync (default): the AuditLog row commits with your</text>
  <text class="small" x="780" y="170">rows, so both exist or neither does.</text>
  <text class="small" x="780" y="198">Async: the queue row commits with your rows instead,</text>
  <text class="small" x="780" y="218">and the dispatcher writes the AuditLog row later.</text>
</svg>
