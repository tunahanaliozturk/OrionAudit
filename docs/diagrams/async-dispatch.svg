<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>


  <rect width="1200" height="680" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionAudit - async capture dispatch, retry and dead-letter</text>
  <text class="subtitle" x="40" y="78">With UseAsyncCapture, a hosted service turns queue rows into AuditLog rows off the hot path.</text>

  <!-- tick -->
  <rect class="step" x="40" y="116" width="240" height="90" rx="14"/>
  <text class="code" x="160" y="146" text-anchor="middle">AuditDispatcherHostedService</text>
  <text class="small" x="160" y="168" text-anchor="middle">every PollInterval (2 s), drains</text>
  <text class="small" x="160" y="186" text-anchor="middle">until a cycle finds no rows</text>

  <path class="flow" d="M280,161 L318,161"/>

  <!-- claim -->
  <rect class="step" x="320" y="116" width="270" height="90" rx="14"/>
  <text class="code" x="455" y="146" text-anchor="middle">DispatchOnceAsync</text>
  <text class="small" x="455" y="168" text-anchor="middle">claims up to BatchSize (500) rows;</text>
  <text class="small" x="455" y="186" text-anchor="middle">a claim expires after ClaimLease (5 min)</text>

  <path class="flow" d="M590,161 L628,161"/>

  <!-- per-row decision -->
  <polygon class="decision" points="730,101 830,161 730,221 630,161"/>
  <text class="label" x="730" y="157" text-anchor="middle">Row builds?</text>
  <text class="small" x="730" y="177" text-anchor="middle">diff per row</text>

  <!-- success -->
  <path class="flow" d="M830,161 L868,161"/>
  <text class="edge" x="849" y="151" text-anchor="middle">yes</text>
  <rect class="step" x="870" y="125" width="290" height="72" rx="14"/>
  <text class="label" x="1015" y="155" text-anchor="middle">AuditLog row added</text>
  <text class="small" x="1015" y="177" text-anchor="middle">claimed queue row removed</text>

  <path class="flow" d="M1015,197 L1015,243"/>

  <rect class="ok" x="870" y="245" width="290" height="90" rx="14"/>
  <text class="label" x="1015" y="275" text-anchor="middle">One transaction</text>
  <text class="small" x="1015" y="297" text-anchor="middle">stamp chain, publish, SaveChanges:</text>
  <text class="small" x="1015" y="315" text-anchor="middle">insert + delete commit together</text>

  <!-- failure path -->
  <path class="flow alt" d="M730,221 L730,283"/>
  <text class="edge" x="744" y="256">throws</text>
  <rect class="step" x="610" y="285" width="240" height="72" rx="14"/>
  <text class="label" x="730" y="315" text-anchor="middle">Attempts++</text>
  <text class="small" x="730" y="337" text-anchor="middle">claim released (ClaimToken = null)</text>

  <path class="flow alt" d="M730,357 L730,401"/>

  <polygon class="decision" points="730,403 840,463 730,523 620,463"/>
  <text class="code" x="730" y="459" text-anchor="middle">MaxAttempts</text>
  <text class="small" x="730" y="479" text-anchor="middle">reached? (5)</text>

  <path class="flow alt" d="M840,463 L898,463"/>
  <text class="edge" x="869" y="453" text-anchor="middle">yes</text>
  <rect class="fail" x="900" y="427" width="260" height="72" rx="14"/>
  <text class="label" x="1030" y="457" text-anchor="middle">Dead-lettered</text>
  <text class="small" x="1030" y="479" text-anchor="middle">Error set; dispatch.rows_deadlettered</text>

  <path class="flow" d="M730,523 L730,575"/>
  <text class="edge" x="744" y="552">no</text>
  <rect class="step" x="610" y="577" width="240" height="72" rx="14"/>
  <text class="label" x="730" y="607" text-anchor="middle">Retried next cycle</text>
  <text class="small" x="730" y="629" text-anchor="middle">the row is claimable again</text>

  <!-- note -->
  <rect class="note" x="40" y="260" width="520" height="120" rx="10"/>
  <text class="code" x="60" y="292">IAuditDispatcher.FlushPendingAsync</text>
  <text class="small" x="60" y="314">drains the queue on demand (tests, read-after-write).</text>
  <text class="small" x="60" y="340">Until a row is dispatched, AuditFor&lt;T&gt;() does not see it:</text>
  <text class="small" x="60" y="360">async capture is eventually consistent.</text>
</svg>
