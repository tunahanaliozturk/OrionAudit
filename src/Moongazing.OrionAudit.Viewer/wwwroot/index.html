<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrionAudit Viewer</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 14px 20px; background: #161922; border-bottom: 1px solid #2a2f3a; display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #2a2f3a; }
  main { padding: 20px; max-width: 900px; margin: 0 auto; }
  .entry { border: 1px solid #2a2f3a; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .entry-head { padding: 10px 14px; background: #161922; display: flex; gap: 12px; }
  .action { font-weight: 600; }
  .change { padding: 6px 14px; border-top: 1px solid #2a2f3a; display: grid; grid-template-columns: 1fr 80px 1fr; gap: 10px; }
  .path { color: #8ab4f8; }
  .old { color: #f28b82; } .new { color: #81c995; }
  .kind { text-transform: uppercase; font-size: 11px; opacity: .7; }
</style>
</head>
<body>
<header>
  <h1>OrionAudit Viewer</h1>
  <span class="badge" id="queue">queue: …</span>
</header>
<!--
  The audit entries are rendered SERVER-SIDE into the placeholder below and HTML-encoded
  on the way out (see OrionAuditViewerStaticFiles). They are deliberately not built in the
  browser from the JSON API: an audited value is attacker-controlled content, and the
  previous innerHTML templating executed it in the reviewing admin's session (stored XSS).
  The only script left touches textContent, which the browser never parses as markup.
-->
<main id="log"><!--orionaudit:entries--></main>
<script>
const base = location.pathname.replace(/\/$/, "");
fetch(base + "/api/meta")
  .then(r => r.json())
  .then(meta => {
    document.getElementById("queue").textContent = "pending: " + (meta.queueDepth ?? 0);
  })
  .catch(() => { document.getElementById("queue").textContent = "queue: n/a"; });
</script>
</body>
</html>
